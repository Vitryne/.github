name: Validar título - PR

on:
  workflow_call:

jobs:
  titulo:
    name: Formato do título
    runs-on: ubuntu-latest
    steps:
      - name: Verificar formato
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          # Formato: "ETI-183 feat: descricao"
          PADRAO='^ETI-[0-9]+ (feat|fix|docs|refactor|test|chore|build|ci|perf)!?: .+'

          if echo "$TITULO" | grep -Eq "$PADRAO"; then
            echo "Título válido: $TITULO"
            exit 0
          fi

          echo "::error::Título fora do padrão -> '$TITULO'"
          echo ""
          echo "Formato esperado: ETI-123 tipo: descrição em minúscula"
          echo "Tipos: feat fix docs refactor test chore build ci perf"
          echo "Exemplo: ETI-183 feat: adiciona cadastro de lojista"
          exit 1
