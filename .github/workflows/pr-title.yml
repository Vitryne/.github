name: Validar título - PR

on:
  workflow_call:
  
jobs:
  titulo:
    name: Formato do título
    runs-on: ubuntu-latest
    steps:
      - name: Verificar formato
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          # Formato: "feat/ETI-183-cadastro-lojista"
          PADRAO='^(feat|fix|docs|refactor|test|chore|build|ci|perf)/ETI-[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$'
          if echo "$TITULO" | LC_ALL=C grep -Eq "$PADRAO"; then
            echo "Título válido: $TITULO"
            exit 0
          fi
          echo "::error title=Título fora do padrão::'$TITULO'"
          echo ""
          echo "Formato esperado: tipo/ETI-123-descricao-em-kebab-case"
          echo "Tipos: feat fix docs refactor test chore build ci perf"
          echo "Descrição: minúsculas e números, palavras separadas por hífen"
          echo "Exemplo: feat/ETI-183-cadastro-lojista"
          exit 1
          
