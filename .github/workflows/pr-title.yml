name: Validar título - PR

on:
  workflow_call:

jobs:
  titulo:
    name: Formato do título
    runs-on: ubuntu-latest
    steps:
      - name: Verificar formato
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          # Formato: "feat(ETI-183): descricao"
          PADRAO='^(feat|fix|docs|refactor|test|chore|build|ci|perf)\(ETI-[0-9]+\)!?: .+'

          if echo "$TITULO" | grep -Eq "$PADRAO"; then
            echo "Título válido: $TITULO"
            exit 0
          fi

          echo "::error::Título fora do padrão -> '$TITULO'"
          echo ""
          echo "Formato esperado: tipo(ETI-123): descrição em minúscula"
          echo "Atenção: SEM espaço antes do parêntese"
          echo "Tipos: feat fix docs refactor test chore build ci perf"
          echo "Exemplo: feat(ETI-183): permitir cadastro de lojista"
          exit 1