name: Qualidade Node

on:
  workflow_call:
    inputs:
      build:
        description: Rodar o build do projeto
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  qualidade:
    name: Qualidade
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar o Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        id: instalar
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verificar tipos
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' }}
        run: npm run typecheck

      - name: Build
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' && inputs.build }}
        run: npm run build

  formatacao:
    name: Formatação
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar o Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar formatação
        run: npm run format:check